<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Data - ALC Competitive Intelligence Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
        <div class="container-lg">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-bar-chart-line"></i> ALC Intelligence
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="data.html">Live Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#github">GitHub</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero py-5 text-center">
        <div class="container-lg py-5">
            <h1 class="display-4 fw-bold mb-4">Live Competitor Data</h1>
            <p class="lead text-muted mb-2">Real-time tracking across Moldova, Georgia, and Armenia</p>
            <p class="text-muted small">
                <i class="bi bi-arrow-repeat"></i> Updated every 24 hours
                <span id="last-updated" class="ms-3"></span>
            </p>
        </div>
    </section>

    <section class="py-5 border-top border-secondary">
        <div class="container-lg">
            <div id="data-container" class="row g-4">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading competitor data...</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        async function loadCompetitorData() {
            try {
                const response = await fetch('data/competitors.json');
                if (!response.ok) throw new Error('Failed to load data');

                const data = await response.json();
                const container = document.getElementById('data-container');
                container.innerHTML = '';

                // Update last refresh time
                const updated = new Date(data.timestamp);
                document.getElementById('last-updated').textContent =
                    `Last updated: ${updated.toLocaleString()} UTC`;

                // Group by market
                const markets = ['moldova', 'georgia', 'armenia'];
                const marketNames = {
                    'moldova': '🇲🇩 Moldova',
                    'georgia': '🇬🇪 Georgia',
                    'armenia': '🇦🇲 Armenia'
                };

                markets.forEach(market => {
                    if (!data.competitors[market] || data.competitors[market].length === 0) return;

                    const section = document.createElement('div');
                    section.className = 'col-12 mb-5';
                    section.innerHTML = `<h2 class="display-6 mb-4">${marketNames[market]} Market</h2>`;
                    container.appendChild(section);

                    data.competitors[market].forEach((comp, idx) => {
                        const status = comp.status === 'online' ?
                            '<span class="badge bg-success">Online</span>' :
                            '<span class="badge bg-danger">Offline</span>';

                        const lastCheck = new Date(comp.last_updated).toLocaleString();

                        const card = document.createElement('div');
                        card.className = 'col-lg-6 col-xl-4';
                        card.innerHTML = `
                            <div class="card bg-dark border-secondary h-100">
                                <div class="card-header border-secondary">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <h6 class="mb-0">${comp.name}</h6>
                                        ${status}
                                    </div>
                                    <small class="text-muted">Checked: ${lastCheck}</small>
                                </div>
                                <div class="card-body">
                                    ${comp.website ? `<p class="mb-2"><a href="${comp.website}" target="_blank" class="text-primary text-decoration-none"><i class="bi bi-globe"></i> Visit Website</a></p>` : ''}
                                    ${comp.facebook ? `<p class="mb-2"><a href="${comp.facebook}" target="_blank" class="text-primary text-decoration-none"><i class="bi bi-facebook"></i> Facebook</a></p>` : ''}
                                    ${comp.instagram ? `<p class="mb-2"><a href="https://instagram.com/${comp.instagram}" target="_blank" class="text-primary text-decoration-none"><i class="bi bi-instagram"></i> @${comp.instagram}</a></p>` : ''}

                                    ${comp.prices_found && comp.prices_found.length > 0 ? `
                                        <hr class="border-secondary">
                                        <div class="text-muted small mb-2"><strong>Pricing Detected:</strong></div>
                                        <ul class="list-unstyled small">
                                            ${comp.prices_found.map(p => `<li class="text-success">💰 ${p}</li>`).join('')}
                                        </ul>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                });

            } catch (error) {
                document.getElementById('data-container').innerHTML = `
                    <div class="col-12 alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        Unable to load live data. First update will run in 24 hours.
                        <br><small class="mt-2 d-block">Error: ${error.message}</small>
                    </div>
                `;
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadCompetitorData);

        // Refresh every 5 minutes
        setInterval(loadCompetitorData, 5 * 60 * 1000);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
