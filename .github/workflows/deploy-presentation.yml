name: Deploy ALC Presentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'alc-presentation/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'alc-presentation/package-lock.json'

      - name: Install dependencies
        working-directory: alc-presentation
        run: npm ci

      - name: Build presentation
        working-directory: alc-presentation
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: 'other'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'alc-presentation/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
